<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Outer ambient glow -->
  <circle cx="50" cy="50" r="46" fill="url(#glow)"/>

  <!-- Main orb -->
  <circle cx="50" cy="50" r="36" fill="url(#core)" filter="url(#blur-glow)"/>

  <!-- Rim highlight -->
  <circle cx="50" cy="50" r="36" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Neural spokes — 6 lines radiating from center -->
  <g stroke="url(#spark)" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
    <line x1="50" y1="50" x2="50"  y2="20"/>
    <line x1="50" y1="50" x2="76"  y2="35"/>
    <line x1="50" y1="50" x2="76"  y2="65"/>
    <line x1="50" y1="50" x2="50"  y2="80"/>
    <line x1="50" y1="50" x2="24"  y2="65"/>
    <line x1="50" y1="50" x2="24"  y2="35"/>
  </g>

  <!-- Node dots at spoke tips -->
  <g fill="url(#spark)" opacity="0.9">
    <circle cx="50" cy="20" r="2.8"/>
    <circle cx="76" cy="35" r="2.8"/>
    <circle cx="76" cy="65" r="2.8"/>
    <circle cx="50" cy="80" r="2.8"/>
    <circle cx="24" cy="65" r="2.8"/>
    <circle cx="24" cy="35" r="2.8"/>
  </g>

  <!-- Centre spark -->
  <circle cx="50" cy="50" r="5.5" fill="#e0d7ff" opacity="0.95" filter="url(#blur-glow)"/>
  <circle cx="50" cy="50" r="2.5" fill="#ffffff"/>
</svg>
