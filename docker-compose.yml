services:
  server:
    build:
      context: ./server
    container_name: washqueue-server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PORT: "3000"

      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}

      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:?ACCESS_TOKEN_EXPIRES_IN is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:?REFRESH_TOKEN_EXPIRES_IN is required}

      REDIS_HOST: ${REDIS_HOST:-valkey}
      REDIS_PORT: ${REDIS_PORT:-6379}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
      RAZORPAYX_WEBHOOK_SECRET: ${RAZORPAYX_WEBHOOK_SECRET:-}

      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}

      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}

    depends_on:
      - valkey
    networks:
      - washqueue
    restart: unless-stopped


  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
        VITE_GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    container_name: washqueue-client
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - washqueue
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    networks:
      - washqueue
    restart: unless-stopped

networks:
  washqueue: