services:
  server:
    build: ./server
    container_name: washqueue-server
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.docker
    networks:
      - washqueue

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    networks:
      - washqueue
  qdrant:
    image: qdrant/qdrant:latest
    container_name: washqueue-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    networks:
      - washqueue

    volumes:
      - qdrant_data:/qdrant/storage

networks:
  washqueue:

volumes:
  qdrant_data: