
name: Deploy Server Image

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rashidnarikkodan/wasqueue-server
  AWS_ACCOUNT_ID: "900160667047"

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900160667047:role/WashQueueServerDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy server through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "::error::Set the EC2_INSTANCE_ID repository variable."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WashQueue server $GITHUB_SHA" \
            --parameters 'commands=[
              "set -eu",
              "cd /home/ubuntu/washqueue",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 900160667047.dkr.ecr.ap-south-1.amazonaws.com",
              "docker compose pull server",
              "docker compose up -d --no-deps server",
              "docker compose ps server"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Server deployment succeeded."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Server deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "::error::Timed out waiting for SSM deployment."
          exit 1
