name: Server CI

on:
  push:
    branches: main
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    branches: main
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, format and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build
